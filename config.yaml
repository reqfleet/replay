replay:
  max_virtual_users_per_engine: 20
  rampup_duration: 0s # 0s disables ramp-up; set e.g. 30s to stage VUs linearly over 30 seconds
  max_active_connections_per_engine: 200
  http2:
    mode: serialized
  timeout:
    connect: 3s
    request: 30s
    idle_connection: 60s
  retry:
    max_attempts: 2
    backoff: exponential
    retry_on_statuses: [429, 502, 503, 504]
    retry_on_errors: [timeout, connection_reset, network, tls]
  validation:
    enabled: true
    status: true
    headers: false
    body: false
    ignore_headers: [x-request-id, date]
  pacing:
    enabled: false
    max_sleep_delta: 30s
  lifecycle:
    require_open: true
  idempotency:
    enabled: true
    block_methods: [POST, PUT, PATCH, DELETE]
    require_header_for_allow: [idempotency-key, x-idempotency-key]
  sharding:
    shard_index: 0
    shard_count: 1
  checkpoint:
    file: "./checkpoint.json"

metrics:
  enabled: true
  namespace: "replay"
  listen_address: "0.0.0.0:9102"
  path: "/metrics"
  max_labels: 20
  common_labels:
    - name: "run_id"
      value: "unknown"
      env: "REPLAY_RUN_ID"
    - name: "worker_id"
      value: "0"
      env: "REPLAY_WORKER_ID"
    - name: "zone"
      value: "unknown"
      env: "REPLAY_ZONE"

target:
  override_url: ""
  require_override: false

header_rewrite:
  drop: [authorization, cookie]
  set: {}
