apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-standalone-config
  labels:
    app: envoy-recorder
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: listener_0
        address:
          socket_address: { address: 0.0.0.0, port_value: 8080 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              generate_request_id: true
              route_config:
                name: local_route
                virtual_hosts:
                - name: backend_service
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route: { cluster: test_cluster }
              http_filters:
              - name: envoy.filters.http.lua
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                  default_source_code:
                    inline_string: |
                      function envoy_on_request(request_handle)
                        local headers = {}
                        for key, value in pairs(request_handle:headers()) do
                          -- Skip pseudo-headers, Envoy internal headers, and request IDs
                          if string.sub(key, 1, 1) ~= ":" and string.sub(key, 1, 8) ~= "x-envoy-" and key ~= "x-request-id" then
                            headers[key] = {value}
                          end
                        end
                        request_handle:streamInfo():dynamicMetadata():set("envoy.lua", "request_headers", headers)
                      end
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              access_log_options:
                flush_access_log_on_new_request: true
              # Formats request-start and flat request-completion logs as NDJSON to stdout.
              # Completion logs use standard Envoy flat fields for inline response validation.
              access_log:
              - name: envoy.access_loggers.stdout
                filter:
                  log_type_filter:
                    types:
                    - DownstreamStart
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                  log_format:
                    json_format:
                      type: "%ACCESS_LOG_TYPE%"
                      node: "%HOSTNAME%"
                      connection_id: "%CONNECTION_ID%"
                      request_id: "%REQ(X-REQUEST-ID)%"
                      timestamp: "%START_TIME%"
                      protocol: "%PROTOCOL%"
                      method: "%REQ(:METHOD)%"
                      authority: "%REQ(:AUTHORITY)%"
                      path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              - name: envoy.access_loggers.stdout
                filter:
                  log_type_filter:
                    types:
                    - DownstreamEnd
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                  log_format:
                    json_format:
                      type: "%ACCESS_LOG_TYPE%"
                      node: "%HOSTNAME%"
                      connection_id: "%CONNECTION_ID%"
                      request_id: "%REQ(X-REQUEST-ID)%"
                      timestamp: "%START_TIME%"
                      method: "%REQ(:METHOD)%"
                      path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                      protocol: "%PROTOCOL%"
                      authority: "%REQ(:AUTHORITY)%"
                      response_code: "%RESPONSE_CODE%"
                      response_flags: "%RESPONSE_FLAGS%"
                      duration_ms: "%DURATION%"
                      bytes_received: "%BYTES_RECEIVED%"
                      bytes_sent: "%BYTES_SENT%"
                      downstream_remote_address: "%DOWNSTREAM_REMOTE_ADDRESS%"
                      upstream_host: "%UPSTREAM_HOST%"
                      user_agent: "%REQ(USER-AGENT)%"
                      headers: "%DYNAMIC_METADATA(envoy.lua:request_headers)%"
      clusters:
      - name: test_cluster
        connect_timeout: 0.25s
        type: STRICT_DNS # STRICT_DNS resolves the Kubernetes service name
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: test_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  # Resolving the upstream service using Kubernetes DNS
                  socket_address: { address: testhttp, port_value: 8080 }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-recorder-proxy
  labels:
    app: envoy-recorder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy-recorder
  template:
    metadata:
      labels:
        app: envoy-recorder
    spec:
      containers:
      - name: envoy
        image: envoyproxy/envoy:v1.28-latest
        ports:
        - containerPort: 8080
          name: http
        command:
        - "envoy"
        - "-c"
        - "/etc/envoy/envoy.yaml"
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
          readOnly: true
      volumes:
      - name: envoy-config
        configMap:
          name: envoy-standalone-config

---
apiVersion: v1
kind: Service
metadata:
  name: envoy-recorder-proxy
  labels:
    app: envoy-recorder
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: envoy-recorder
